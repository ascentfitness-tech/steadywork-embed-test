<!-- Steadywork widget -->
<button id="sw-launcher" onclick="swToggle()" aria-label="Open chat">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  <span>Questions? Ask us</span>
</button>

<div id="sw-frame-wrap">
  <button id="sw-close" onclick="swToggle()" aria-label="Close chat">&times;</button>
  <iframe id="steadywork-widget"
    src="https://steadywork.bubbleapps.io/version-test/chat_widget/1790689930084x652365155338785400"
    title="Chat with Whitfield Roofing"></iframe>
</div>

<script>
function swToggle() {
  var w = document.getElementById('sw-frame-wrap');
  var l = document.getElementById('sw-launcher');
  var open = w.style.display === 'block';
  w.style.display = open ? 'none' : 'block';
  l.style.display = open ? 'flex' : 'none';
}
</script>
